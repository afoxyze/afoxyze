<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Selected work</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#ffffff;
    --ink:#0a0a0a;
    --ink-2:#1a1a1a;
    --muted:#8a8a8a;
    --muted-2:#bdbdbd;
    --line:#ececec;
    --line-2:#f5f5f5;
    --card:#fafafa;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);overflow-x:hidden}
  body{
    font-family:"Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    font-weight:400;
    font-feature-settings:"ss01","cv11";
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    line-height:1.5;
    letter-spacing:-0.01em;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  /* ---------- Top progress strip ---------- */
  .top-progress{
    position:fixed;
    top:0;left:0;right:0;
    height:1px;
    background:transparent;
    z-index:20;
    pointer-events:none;
  }
  .top-progress::before{
    content:"";
    position:absolute;left:0;top:0;bottom:0;
    width:var(--progress, 33%);
    background:var(--ink);
    transition:width .8s cubic-bezier(.22,1,.36,1);
  }

  /* ---------- Status line ---------- */
  .status{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:28px 48px 20px;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-variant-numeric:tabular-nums;
  }
  .status .left, .status .right{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .status .live::before{
    content:"";
    display:inline-block;
    width:5px;height:5px;
    background:#16a34a;
    border-radius:50%;
    margin-right:7px;
    transform:translateY(-1px);
    animation:pulse 2.4s ease-in-out infinite;
  }
  .status .sep{color:var(--muted-2)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ---------- Hero ---------- */
  .hero{
    flex:1;
    display:grid;
    grid-template-columns: minmax(0,1fr) minmax(0,1.1fr);
    gap:64px;
    align-items:center;
    padding:24px 48px 40px;
    min-height:calc(100vh - 220px);
  }

  .hero-left{
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    height:100%;
    min-height:480px;
    padding:24px 0;
  }

  /* Big number — Plus Jakarta Sans, ultra-tight */
  .index-stack{
    position:relative;
    height:240px;
    overflow:hidden;
  }
  .index-num{
    position:absolute;
    top:0;left:0;
    font-family:"Plus Jakarta Sans", sans-serif;
    font-size:240px;
    font-weight:300;
    line-height:0.85;
    letter-spacing:-0.06em;
    color:var(--ink);
    will-change:transform,opacity;
    display:flex;
    gap:0;
  }
  /* Animate each digit independently */
  .digit{
    display:inline-block;
    transition:transform .8s cubic-bezier(.22,1,.36,1), opacity .55s ease;
    will-change:transform,opacity;
  }
  .index-num.is-active .digit{
    transform:translateY(0);
    opacity:1;
  }
  .index-num.is-prev .digit{
    transform:translateY(-110%);
    opacity:0;
  }
  .index-num.is-next .digit{
    transform:translateY(110%);
    opacity:0;
  }
  /* stagger the digits for a flip-board feel */
  .digit:nth-child(2){transition-delay:.04s}

  .hero-meta{
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .kicker{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.2em;
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:500;
  }
  .kicker .rule{
    width:36px;
    height:1px;
    background:var(--ink);
    transition:width .8s cubic-bezier(.22,1,.36,1);
  }
  .kicker .rule.grow{width:64px}

  .title-stack{
    position:relative;
    height:88px;
    overflow:hidden;
  }
  .project-name{
    position:absolute;
    top:0;left:0;
    font-family:"Plus Jakarta Sans", sans-serif;
    font-size:68px;
    font-weight:500;
    line-height:1;
    letter-spacing:-0.04em;
    white-space:nowrap;
    will-change:transform,opacity;
    color:var(--ink);
  }
  .project-name.is-active{
    transform:translateY(0);
    opacity:1;
    transition:transform .8s cubic-bezier(.22,1,.36,1) .04s, opacity .6s ease;
  }
  .project-name.is-prev{
    transform:translateY(-100%);
    opacity:0;
    transition:transform .8s cubic-bezier(.22,1,.36,1), opacity .5s ease;
  }
  .project-name.is-next{
    transform:translateY(100%);
    opacity:0;
  }

  .desc-stack{
    position:relative;
    height:96px;
    max-width:460px;
  }
  .project-desc{
    position:absolute;
    top:0;left:0;right:0;
    font-size:16px;
    line-height:1.6;
    color:var(--ink-2);
    text-wrap:pretty;
    will-change:transform,opacity;
  }
  .project-desc.is-active{
    transform:translateY(0);
    opacity:1;
    transition:transform .7s cubic-bezier(.22,1,.36,1) .1s, opacity .55s ease .06s;
  }
  .project-desc.is-prev{
    transform:translateY(-12px);
    opacity:0;
    transition:transform .6s cubic-bezier(.22,1,.36,1), opacity .35s ease;
  }
  .project-desc.is-next{
    transform:translateY(12px);
    opacity:0;
  }

  /* Stats row — quiet, magazine-like */
  .stats{
    display:flex;
    align-items:flex-start;
    gap:36px;
    margin-top:4px;
    padding-top:18px;
    border-top:1px solid var(--line);
    max-width:480px;
  }
  .stat{
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:0;
  }
  .stat-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.2em;
    color:var(--muted);
  }
  .stat-stack{
    position:relative;
    height:18px;
    overflow:hidden;
  }
  .stat-val{
    position:absolute;top:0;left:0;
    font-size:13px;
    font-weight:500;
    color:var(--ink);
    letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums;
    will-change:transform,opacity;
  }
  .stat-val.is-active{transform:translateY(0);opacity:1;transition:transform .7s cubic-bezier(.22,1,.36,1) .12s, opacity .5s ease .08s}
  .stat-val.is-prev{transform:translateY(-100%);opacity:0;transition:transform .6s cubic-bezier(.22,1,.36,1), opacity .35s ease}
  .stat-val.is-next{transform:translateY(100%);opacity:0}

  .visit-row{
    display:flex;
    align-items:center;
    gap:20px;
    margin-top:24px;
    padding-top:24px;
    border-top:1px solid var(--line);
    max-width:480px;
  }
  .visit-btn{
    display:inline-flex;
    align-items:center;
    gap:14px;
    padding:14px 22px 14px 24px;
    border-radius:999px;
    background:var(--ink);
    color:#fff;
    font-size:13px;
    letter-spacing:0.02em;
    font-weight:500;
    transition:background .25s ease, transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .visit-btn:hover{background:#000;}
  .visit-btn:hover .arrow-c{transform:translate(2px,-2px)}
  .visit-btn .arrow-c{
    width:18px;height:18px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .domain-text{
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.04em;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- Hero right: visual stack ---------- */
  .hero-right{
    position:relative;
    height:520px;
    perspective:1400px;
    transform-style:preserve-3d;
  }
  .hero-right-inner{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    transition:transform .9s cubic-bezier(.22,1,.36,1);
    will-change:transform;
  }
  .visual{
    position:absolute;
    inset:0;
    border-radius:10px;
    overflow:hidden;
    background:#fafafa;
    border:1px solid var(--line);
    transition:transform .85s cubic-bezier(.22,1,.36,1), opacity .6s ease, filter .6s ease;
    will-change:transform,opacity;
  }
  .visual.is-active{
    transform:translateX(0) rotateY(0deg) scale(1);
    opacity:1;
    z-index:3;
    filter:none;
  }
  .visual.is-prev{
    transform:translateX(-12%) rotateY(8deg) scale(.92);
    opacity:0;
    z-index:1;
    filter:saturate(.7) brightness(1.02);
  }
  .visual.is-next{
    transform:translateX(12%) rotateY(-8deg) scale(.92);
    opacity:0;
    z-index:1;
    filter:saturate(.7) brightness(1.02);
  }

  .visual-frame-wrap{
    position:absolute;
    inset:0;
    overflow:hidden;
  }
  .visual-frame{
    position:absolute;top:0;left:0;
    width:1280px;height:900px;
    border:0;
    background:#fff;
    transform-origin:top left;
  }
  .visual-fallback{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg,#fbfbfb,#f0f0f0);
    color:var(--muted-2);
    gap:14px;
  }
  .visual-fallback .glyph{
    font-family:"Plus Jakarta Sans", sans-serif;
    font-weight:300;
    font-size:200px;
    line-height:0.9;
    color:var(--ink);
    letter-spacing:-0.06em;
  }
  .visual-fallback .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.18em;
    color:var(--muted);
  }
  .visual-corner{
    position:absolute;
    top:14px;left:16px;
    font-size:10px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink);
    background:rgba(255,255,255,.85);
    border:1px solid var(--line);
    padding:5px 10px;
    border-radius:999px;
    backdrop-filter:saturate(140%) blur(6px);
    z-index:5;
    pointer-events:none;
    font-weight:500;
  }

  /* ---------- Bottom rail ---------- */
  .rail{
    display:grid;
    grid-template-columns:auto 1fr auto auto;
    align-items:center;
    gap:32px;
    padding:24px 48px 32px;
    border-top:1px solid var(--line);
  }

  .rail-counter{
    font-size:34px;
    line-height:1;
    letter-spacing:-0.04em;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    display:flex;
    align-items:baseline;
    gap:6px;
    font-weight:500;
  }
  .rail-counter .slash{color:var(--muted-2);font-size:24px;font-weight:300}
  .rail-counter .total{color:var(--muted);font-size:24px;font-weight:400}

  .rail-list{
    display:flex;
    align-items:center;
    gap:0;
    overflow:hidden;
  }
  .rail-item{
    flex:1;
    min-width:0;
    padding:8px 16px;
    border-left:1px solid var(--line);
    cursor:pointer;
    color:var(--muted);
    transition:color .25s ease, padding .35s cubic-bezier(.2,.7,.2,1);
    text-align:left;
    background:none;
    border-top:0;border-right:0;border-bottom:0;
    font-family:inherit;
  }
  .rail-item:last-child{border-right:1px solid var(--line)}
  .rail-item:hover{color:var(--ink)}
  .rail-item.active{color:var(--ink)}
  .rail-item .ri-num{
    font-size:10px;
    letter-spacing:0.18em;
    font-variant-numeric:tabular-nums;
    margin-bottom:4px;
    display:block;
    font-weight:500;
  }
  .rail-item .ri-name{
    font-size:14px;
    font-weight:500;
    letter-spacing:-0.015em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rail-item.active .ri-num{color:var(--ink)}
  .rail-item .ri-bar{
    margin-top:8px;
    height:1px;
    background:var(--line);
    position:relative;
    overflow:hidden;
  }
  .rail-item .ri-bar::after{
    content:"";
    position:absolute; left:0;top:0;bottom:0;
    width:0%;
    background:var(--ink);
    transition:width .35s ease;
  }
  .rail-item.active .ri-bar::after{width:100%}

  /* Active dot indicator on rail item */
  .rail-item .ri-name{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .rail-item .ri-name::before{
    content:"";
    width:5px;height:5px;
    border-radius:50%;
    background:var(--ink);
    opacity:0;
    transform:scale(0);
    transition:opacity .3s ease, transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .rail-item.active .ri-name::before{
    opacity:1;
    transform:scale(1);
    animation:pulse 2.4s ease-in-out infinite;
  }

  /* Initial reveal */
  @keyframes reveal-up{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:translateY(0)}
  }
  .reveal{animation:reveal-up .9s cubic-bezier(.22,1,.36,1) both}
  .reveal-1{animation-delay:.05s}
  .reveal-2{animation-delay:.15s}
  .reveal-3{animation-delay:.25s}
  .reveal-4{animation-delay:.35s}

  /* "Next up" preview */
  .next-up{
    display:flex;
    align-items:center;
    gap:14px;
    padding:8px 16px 8px 18px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    cursor:pointer;
    transition:border-color .25s ease, transform .35s cubic-bezier(.2,.7,.2,1), background .25s ease;
    font-family:inherit;
    color:var(--ink);
  }
  .next-up:hover{border-color:var(--ink);transform:translateX(2px)}
  .next-up .nu-label{
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:500;
  }
  .next-up .nu-name{
    font-size:13px;
    font-weight:500;
    letter-spacing:-0.015em;
    color:var(--ink);
  }
  .next-up .nu-stack{display:flex;flex-direction:column;gap:2px;text-align:left}
  .next-up .nu-arrow{
    width:14px;height:14px;color:var(--ink);
    transition:transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .next-up:hover .nu-arrow{transform:translateX(3px)}

  .rail-nav{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .nav-btn{
    width:44px;height:44px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    transition:border-color .2s ease, background .2s ease, transform .25s cubic-bezier(.2,.7,.2,1), color .2s ease;
  }
  .nav-btn:hover{border-color:var(--ink);}
  .nav-btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .nav-btn:active{transform:scale(.94)}
  .nav-btn[disabled]{opacity:.25;cursor:not-allowed}
  .nav-btn svg{width:14px;height:14px}

  /* Theme toggle (in status bar) */
  .theme-toggle{
    position:relative;
    width:46px;height:24px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    cursor:pointer;
    padding:0;
    transition:background .3s ease, border-color .3s ease;
    flex:0 0 auto;
  }
  .theme-toggle .tt-thumb{
    position:absolute;
    top:2px;left:2px;
    width:18px;height:18px;
    border-radius:50%;
    background:#0a0a0a;
    transition:transform .35s cubic-bezier(.2,.7,.2,1), background .3s ease;
  }
  .theme-toggle:hover{border-color:var(--ink)}

  /* ---------- Tweak variants ---------- */
  body[data-theme="dark"]{
    --bg:#0a0a0a; --ink:#f5f5f5; --ink-2:#dedede; --muted:#7a7a7a; --muted-2:#3a3a3a; --line:#1f1f1f; --line-2:#181818; --card:#141414;
  }
  body[data-theme="dark"] .visit-btn{background:#fff;color:#0a0a0a}
  body[data-theme="dark"] .visit-btn:hover{background:#fff}
  body[data-theme="dark"] .nav-btn{background:#0a0a0a;color:#fff}
  body[data-theme="dark"] .nav-btn.primary{background:#fff;color:#0a0a0a;border-color:#fff}
  body[data-theme="dark"] .next-up{background:#0a0a0a;color:#fff}
  body[data-theme="dark"] .visual-corner{background:rgba(20,20,20,.85);color:#fff;border-color:#1f1f1f}
  body[data-theme="dark"] .visual-fallback{background:linear-gradient(180deg,#0f0f0f,#1c1c1c);color:#444}
  body[data-theme="dark"] .visual-fallback .glyph{color:#fff}
  body[data-theme="dark"] .top-progress::before{background:#fff}
  body[data-theme="dark"] .theme-toggle{background:#141414;border-color:#1f1f1f}
  body[data-theme="dark"] .theme-toggle .tt-thumb{background:#fff;transform:translateX(20px)}

  body[data-density="airy"] .hero{ gap:96px; padding:32px 80px 56px }
  body[data-density="airy"] .status{ padding:32px 80px 24px }
  body[data-density="airy"] .rail{ padding:32px 80px 40px }
  body[data-density="tight"] .hero{ gap:40px; padding:16px 32px 24px }
  body[data-density="tight"] .status{ padding:18px 32px 12px }
  body[data-density="tight"] .rail{ padding:16px 32px 24px }

  body[data-numweight="thin"] .index-num{font-weight:200}
  body[data-numweight="bold"] .index-num{font-weight:600}

  /* Mobile */
  @media (max-width:900px){
    .hero{
      grid-template-columns:1fr;
      gap:24px;
      padding:8px 24px 24px;
    }
    .status{padding:18px 24px 12px}
    .rail{padding:16px 24px 24px;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:16px}
    .rail-list{display:none}
    .rail-counter{grid-column:1}
    .rail-nav{grid-column:2;justify-content:flex-end}
    .next-up{grid-column:1 / -1}
    .index-num{font-size:140px}
    .index-stack{height:140px}
    .project-name{font-size:40px}
    .title-stack{height:48px}
    .desc-stack{height:auto;position:relative;min-height:80px}
    .project-desc{position:relative}
    .project-desc.is-prev,.project-desc.is-next{position:absolute}
    .hero-right{height:300px;order:2}
    .hero-left{order:1;min-height:auto;padding:8px 0}
    .stats{gap:24px;padding-top:14px}
  }
</style>
</head>
<body data-theme="light" data-density="normal" data-numweight="thin">

  <div class="top-progress" id="top-progress"></div>

  <!-- Status -->
  <div class="status reveal reveal-1">
    <div class="left">
      <span class="live" id="live-time">—</span>
      <span class="sep">·</span>
      <span>Jakarta, ID</span>
    </div>
    <div class="right">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <span class="tt-thumb"></span>
      </button>
    </div>
  </div>

  <!-- Hero -->
  <main class="hero">
    <section class="hero-left reveal reveal-2">

      <div class="index-stack" id="index-stack"></div>

      <div class="hero-meta">
        <div class="kicker">
          <span class="rule grow" id="kicker-rule"></span>
          <span id="kicker">—</span>
        </div>
        <div class="title-stack" id="title-stack"></div>
        <div class="desc-stack" id="desc-stack"></div>

        <div class="visit-row">
          <a class="visit-btn" id="visit-btn" href="#" target="_blank" rel="noopener">
            <span>Visit project</span>
            <span class="arrow-c">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 17L17 7M9 7h8v8"/></svg>
            </span>
          </a>
          <span class="domain-text" id="domain-text"></span>
        </div>
      </div>

    </section>

    <section class="hero-right reveal reveal-3" id="hero-right">
      <div class="hero-right-inner" id="visuals"></div>
    </section>
  </main>

  <!-- Bottom rail -->
  <div class="rail reveal reveal-4">
    <div class="rail-counter">
      <span id="rc-cur">01</span>
      <span class="slash">/</span>
      <span class="total" id="rc-tot">03</span>
    </div>

    <div class="rail-list" id="rail-list"></div>

    <button class="next-up" id="next-up">
      <div class="nu-stack">
        <span class="nu-label">Next up</span>
        <span class="nu-name" id="nu-name">—</span>
      </div>
      <svg class="nu-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg>
    </button>

    <div class="rail-nav">
      <button class="nav-btn" id="prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="nav-btn primary" id="next" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  </div>

<script>
  /*EDITMODE-BEGIN*/const TWEAK_DEFAULTS = {
    "theme":"light",
    "density":"normal",
    "numweight":"thin",
    "autoplay":false,
    "showLivePreview":true
  }/*EDITMODE-END*/;

  const PROJECTS = [
    {
      n:"01",
      kicker:"Legal · AI",
      title:"TanyaKerja",
      desc:"Tanya peraturan ketenagakerjaan Indonesia — kontrak, PHK, pesangon, lembur — dijawab berbasis pasal.",
      url:"https://tanyakerja.afoxyze.dev",
      domain:"tanyakerja.afoxyze.dev",
      glyph:"T",
      year:"2025",
      stack:"Next · LLM · pasal.id",
      status:"Live"
    },
    {
      n:"02",
      kicker:"OSINT · Investigation",
      title:"KONEKSI.ID",
      desc:"Memetakan aliansi bisnis-politik dan konsentrasi kepemilikan dalam proyek strategis nasional.",
      url:"https://proyekbagus.afoxyze.dev",
      domain:"proyekbagus.afoxyze.dev",
      glyph:"K",
      year:"2025",
      stack:"Next · Graph · OSINT",
      status:"Live"
    },
    {
      n:"03",
      kicker:"Public budget · Live",
      title:"Biaya MBG",
      desc:"Ticker anggaran Makan Bergizi Gratis — biaya program, real-time, dalam angka publik.",
      url:"https://mbg.afoxyze.dev",
      domain:"mbg.afoxyze.dev",
      glyph:"R",
      year:"2025",
      stack:"Next · Realtime",
      status:"Live"
    }
  ];

  // ---------- Build stacks ----------
  const indexStack = document.getElementById("index-stack");
  const titleStack = document.getElementById("title-stack");
  const descStack  = document.getElementById("desc-stack");
  const visuals    = document.getElementById("visuals");
  const railList   = document.getElementById("rail-list");
  PROJECTS.forEach((p,i)=>{
    const num = document.createElement("div");
    num.className = "index-num";
    num.dataset.i = i;
    // split into digit spans for staggered motion
    num.innerHTML = p.n.split("").map(d=>`<span class="digit">${d}</span>`).join("");
    indexStack.appendChild(num);

    const tn = document.createElement("div");
    tn.className = "project-name";
    tn.textContent = p.title;
    tn.dataset.i = i;
    titleStack.appendChild(tn);

    const d = document.createElement("div");
    d.className = "project-desc";
    d.textContent = p.desc;
    d.dataset.i = i;
    descStack.appendChild(d);

    const v = document.createElement("div");
    v.className = "visual";
    v.dataset.i = i;
    v.innerHTML = `
      <div class="visual-corner">${p.n} · ${p.domain}</div>
      <div class="visual-frame-wrap">
        <div class="visual-fallback"><div class="glyph">${p.glyph}</div><div class="label">live preview</div></div>
        <iframe class="visual-frame" loading="lazy" referrerpolicy="no-referrer"
                sandbox="allow-scripts allow-same-origin"
                style="display:none"
                data-src="${p.url}"></iframe>
      </div>
    `;
    visuals.appendChild(v);

    const r = document.createElement("button");
    r.className = "rail-item";
    r.dataset.i = i;
    r.innerHTML = `
      <span class="ri-name">${p.title}</span>
      <div class="ri-bar"></div>
    `;
    r.addEventListener("click", ()=>go(i));
    railList.appendChild(r);
  });

  document.getElementById("rc-tot").textContent = String(PROJECTS.length).padStart(2,"0");

  // ---------- Iframe sizing ----------
  function fitIframe(fr){
    const wrap = fr.parentElement;
    const w = wrap.offsetWidth, h = wrap.offsetHeight;
    const targetW = 1280;
    const scale = w / targetW;
    fr.style.transform = `scale(${scale})`;
    fr.style.width = targetW + "px";
    fr.style.height = (h / scale) + "px";
  }
  function fitAll(){
    document.querySelectorAll(".visual-frame").forEach(fitIframe);
  }

  // ---------- State / navigation ----------
  let idx = 0;

  function setStateClass(elements, currentIdx){
    elements.forEach(el=>{
      const i = parseInt(el.dataset.i,10);
      el.classList.remove("is-active","is-prev","is-next");
      if (i===currentIdx) el.classList.add("is-active");
      else if (i < currentIdx) el.classList.add("is-prev");
      else el.classList.add("is-next");
    });
  }

  function loadVisualIfNeeded(i){
    if (!showLivePreview) return;
    const v = visuals.querySelector(`.visual[data-i="${i}"]`);
    if (!v) return;
    const fr = v.querySelector(".visual-frame");
    if (fr && !fr.src){
      fr.src = fr.dataset.src;
      fr.addEventListener("load", ()=>{
        fr.style.display = "block";
        fitIframe(fr);
      }, { once:true });
    } else if (fr && fr.src){
      fitIframe(fr);
    }
  }

  function update(){
    setStateClass(document.querySelectorAll(".index-num"), idx);
    setStateClass(document.querySelectorAll(".project-name"), idx);
    setStateClass(document.querySelectorAll(".project-desc"), idx);
    setStateClass(document.querySelectorAll(".visual"), idx);

    const p = PROJECTS[idx];
    document.getElementById("kicker").textContent = p.kicker;
    document.getElementById("visit-btn").href = p.url;
    document.getElementById("domain-text").textContent = p.domain;
    document.querySelectorAll(".rail-item").forEach((r,i)=>{
      r.classList.toggle("active", i===idx);
    });

    document.getElementById("rc-cur").textContent = p.n;

    // Next up
    const nextI = (idx+1) % PROJECTS.length;
    document.getElementById("nu-name").textContent = PROJECTS[nextI].title;

    // Top progress
    const pct = ((idx+1) / PROJECTS.length) * 100;
    document.getElementById("top-progress").style.setProperty("--progress", pct+"%");

    loadVisualIfNeeded(idx);
    if (idx+1 < PROJECTS.length) loadVisualIfNeeded(idx+1);
    if (idx-1 >= 0) loadVisualIfNeeded(idx-1);

    document.getElementById("prev").disabled = idx===0;
  }

  function go(i){
    idx = ((i % PROJECTS.length) + PROJECTS.length) % PROJECTS.length;
    update();
  }

  document.getElementById("prev").addEventListener("click", ()=>{
    if (idx>0) go(idx-1);
  });
  document.getElementById("next").addEventListener("click", ()=>{
    go((idx+1) % PROJECTS.length);
  });
  document.getElementById("next-up").addEventListener("click", ()=>{
    go((idx+1) % PROJECTS.length);
  });

  // Keyboard
  window.addEventListener("keydown", e=>{
    if (e.key==="ArrowLeft") go(idx-1);
    if (e.key==="ArrowRight") go(idx+1);
    if (e.key==="Enter") window.open(PROJECTS[idx].url, "_blank", "noopener");
  });

  // Wheel — horizontal trackpad
  let wheelTO=null;
  window.addEventListener("wheel", e=>{
    if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
    if (wheelTO) return;
    wheelTO = setTimeout(()=>{wheelTO=null;}, 380);
    if (e.deltaX > 0) go(idx+1); else go(idx-1);
  }, {passive:true});

  // Touch swipe
  let tStart=null;
  document.querySelector(".hero").addEventListener("touchstart", e=>{
    tStart = e.touches[0].clientX;
  }, {passive:true});
  document.querySelector(".hero").addEventListener("touchend", e=>{
    if (tStart==null) return;
    const dx = (e.changedTouches[0].clientX - tStart);
    if (Math.abs(dx) > 50){ if (dx<0) go(idx+1); else go(idx-1); }
    tStart=null;
  }, {passive:true});

  // Live time
  function updateTime(){
    try{
      const t = new Date().toLocaleTimeString("en-GB",{
        timeZone:"Asia/Jakarta", hour:"2-digit", minute:"2-digit"
      });
      document.getElementById("live-time").textContent = t + " WIB";
    }catch(e){ document.getElementById("live-time").textContent="—"; }
  }
  updateTime();
  setInterval(updateTime, 30000);

  window.addEventListener("resize", fitAll);

  // Subtle parallax tilt on visual area
  const heroRight = document.getElementById("hero-right");
  const heroInner = document.getElementById("visuals");
  let tiltRAF=null;
  heroRight.addEventListener("mousemove", e=>{
    const r = heroRight.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    if (tiltRAF) cancelAnimationFrame(tiltRAF);
    tiltRAF = requestAnimationFrame(()=>{
      heroInner.style.transform = `rotateY(${x*4}deg) rotateX(${-y*4}deg)`;
      heroInner.style.transition = "transform .25s cubic-bezier(.2,.7,.2,1)";
    });
  });
  heroRight.addEventListener("mouseleave", ()=>{
    heroInner.style.transition = "transform .9s cubic-bezier(.22,1,.36,1)";
    heroInner.style.transform = "rotateY(0deg) rotateX(0deg)";
  });

  // ---------- Tweaks ----------
  let panelEl=null, tweaksOpen=false;
  let showLivePreview = TWEAK_DEFAULTS.showLivePreview;
  let autoplayInt=null;
  const tweakState = {...TWEAK_DEFAULTS};

  function setAutoplay(on){
    if (autoplayInt){clearInterval(autoplayInt);autoplayInt=null;}
    if (on) autoplayInt = setInterval(()=>go(idx+1), 5000);
  }

  function applyTweaks(t){
    document.body.dataset.theme = t.theme;
    document.body.dataset.density = t.density;
    document.body.dataset.numweight = t.numweight;
    showLivePreview = !!t.showLivePreview;
    if (!showLivePreview){
      document.querySelectorAll(".visual-frame").forEach(fr=>{ fr.style.display="none"; });
    } else {
      document.querySelectorAll(".visual-frame").forEach(fr=>{
        if (fr.src) fr.style.display="block";
      });
      loadVisualIfNeeded(idx);
    }
    setAutoplay(!!t.autoplay);
    requestAnimationFrame(fitAll);
  }

  // Theme toggle button in status bar
  document.getElementById("theme-toggle").addEventListener("click", ()=>{
    const cur = document.body.dataset.theme || "light";
    const next = cur === "light" ? "dark" : "light";
    tweakState.theme = next;
    applyTweaks(tweakState);
    persist({theme: next});
  });
  applyTweaks(TWEAK_DEFAULTS);

  // Initial render
  requestAnimationFrame(()=>{ update(); fitAll(); });

  function persist(edits){
    try{ window.parent.postMessage({type:"__edit_mode_set_keys", edits},"*"); }catch(e){}
  }

  function buildPanel(){
    const wrap = document.createElement("div");
    wrap.id = "tweaks-panel";
    wrap.style.cssText = `
      position:fixed; right:24px; bottom:48px; z-index:100;
      width:300px; background:#fff;
      border:1px solid #e5e5e5; border-radius:12px;
      box-shadow:0 24px 48px -12px rgba(0,0,0,.18), 0 6px 12px -6px rgba(0,0,0,.08);
      font-family:"Plus Jakarta Sans", sans-serif; font-size:13px; color:#0a0a0a;
      padding:18px 20px 20px;
    `;
    const state = {...TWEAK_DEFAULTS};
    function row(label, controls){
      return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #f0f0f0">
        <div style="font-size:12px;color:#666">${label}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${controls}</div></div>`;
    }
    function seg(name, opts, current){
      return opts.map(o=>`<button data-tweak="${name}" data-val="${o.v}"
        style="font-family:inherit;font-size:11px;padding:5px 10px;border-radius:6px;
               border:1px solid ${current===o.v?'#0a0a0a':'#e5e5e5'};
               background:${current===o.v?'#0a0a0a':'#fff'};
               color:${current===o.v?'#fff':'#0a0a0a'};cursor:pointer">${o.l}</button>`).join("");
    }
    function tog(name, current){
      return `<button data-tweak="${name}" data-val="${!current}"
        style="font-family:inherit;font-size:11px;padding:5px 10px;border-radius:6px;
               border:1px solid ${current?'#0a0a0a':'#e5e5e5'};
               background:${current?'#0a0a0a':'#fff'};
               color:${current?'#fff':'#0a0a0a'};cursor:pointer">${current?'On':'Off'}</button>`;
    }
    function render(){
      wrap.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <div style="font-weight:600;letter-spacing:-0.01em">Tweaks</div>
          <button id="tw-close" style="background:none;border:0;color:#999;font-size:18px;cursor:pointer;line-height:1;padding:0 4px">×</button>
        </div>
        <div style="font-size:11px;color:#999;margin-bottom:6px">Editorial portfolio · variations</div>
        ${row("Theme", seg("theme",[{v:"light",l:"Light"},{v:"dark",l:"Dark"}], state.theme))}
        ${row("Density", seg("density",[{v:"tight",l:"Tight"},{v:"normal",l:"Normal"},{v:"airy",l:"Airy"}], state.density))}
        ${row("Numeral weight", seg("numweight",[{v:"thin",l:"Thin"},{v:"bold",l:"Bold"}], state.numweight))}
        ${row("Autoplay", tog("autoplay", state.autoplay))}
        ${row("Live preview", tog("showLivePreview", state.showLivePreview))}
      `;
      wrap.querySelector("#tw-close").onclick = ()=>{
        closePanel();
        try{ window.parent.postMessage({type:"__edit_mode_dismissed"},"*"); }catch(e){}
      };
      wrap.querySelectorAll("button[data-tweak]").forEach(b=>{
        b.onclick = ()=>{
          const k=b.dataset.tweak; let v=b.dataset.val;
          if (v==="true") v=true; else if (v==="false") v=false;
          state[k]=v;
          applyTweaks(state);
          persist({[k]:v});
          render();
        };
      });
    }
    render();
    return wrap;
  }

  function openPanel(){ if(tweaksOpen)return; tweaksOpen=true; panelEl=buildPanel(); document.body.appendChild(panelEl); }
  function closePanel(){ tweaksOpen=false; if(panelEl){panelEl.remove();panelEl=null;} }

  window.addEventListener("message", e=>{
    const d=e.data; if (!d||typeof d!=="object") return;
    if (d.type==="__activate_edit_mode") openPanel();
    if (d.type==="__deactivate_edit_mode") closePanel();
  });
  try{ window.parent.postMessage({type:"__edit_mode_available"},"*"); }catch(e){}
</script>
</body>
</html>
